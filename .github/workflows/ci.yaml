    #   postgres:
    #     image: postgres:16
    #     ports:
    #       - "5432:5432"
    #     env:
    #       POSTGRES_PASSWORD: secretpassword
    env:
      BATON_LOG_LEVEL: debug
      BATON_API_TOKEN: ${{ secrets.BATON_API_TOKEN }}
      BATON_DOMAIN: 'integrator-8338476.okta.com'
      BATON_EMAIL_DOMAINS: 'insulator.com'
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - name: Checkout code
        uses: actions/checkout@v4
      # Install any dependencies here (or delete this)
      # - name: Install postgres client
      #   run: sudo apt install postgresql-client
      # Run any fixture setup here (or delete this)
      # - name: Import sql into postgres
      #   run: psql -h localhost --user postgres -f environment.sql
      #   env:
      #     PGPASSWORD: secretpassword
      - name: Build baton-okta-ciam-workforce
        run: go build ./cmd/baton-okta-ciam-workforce
      - name: Test syncing
        uses: ConductorOne/github-workflows/actions/sync-test@v2
        with:
          connector: ./baton-okta-ciam-workforce
          baton-entitlement: 'group:00gw08799oN84g2FA697:member'
          baton-principal: '00uw05rqxhaVFs0Jw697'
          baton-principal-type: 'user'
